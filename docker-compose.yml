services:
  web:
    build: .
    env_file:
      - .env
    labels:
      - traefik.enable=true
      - traefik.http.services.mavi.loadbalancer.server.port=3000
      - traefik.http.routers.mavi.rule=Host(`mariadamavi.com.br`) || Host(`www.mariadamavi.com.br`)
      - traefik.http.routers.mavi.entrypoints=websecure
      - traefik.http.routers.mavi.tls.certresolver=letsencrypt
    restart: unless-stopped
